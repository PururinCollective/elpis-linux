# Built into the GRUB core images (BIOS El Torito and BOOTX64.EFI).
# Finds the ISO this GRUB belongs to -- on the disk GRUB started from first --
# and hands over to its menu.  post-image.sh fills in @ISO_UUID@.

set elpis_iso_uuid=@ISO_UUID@
regexp --set=1:elpis_bootdisk '^([^,]+)' "$root"
search --no-floppy --fs-uuid --set=root --hint="${elpis_bootdisk},msdos1" --hint="${elpis_bootdisk}" "$elpis_iso_uuid"
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
